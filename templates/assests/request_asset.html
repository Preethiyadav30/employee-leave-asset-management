<!DOCTYPE html>
<html>
<head>
    <title>Request Asset</title>
</head>
<body>
    <h1>Request an Asset</h1>

    {% if messages %}
        {% for message in messages %}
            <p style="color: green; font-weight: bold;">
                {{ message }}
            </p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Request Asset</button>
    </form>

    <br>
    <a href="{% url 'profile' %}">Back to Profile</a>
</body>
</html>
